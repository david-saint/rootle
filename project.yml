name: Rootle
options:
  bundleIdPrefix: dev.davidsaint
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    DEVELOPMENT_TEAM: 62LTV4PK7X
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO

targets:
  Rootle-iOS:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_NAME: Rootle
        PRODUCT_BUNDLE_IDENTIFIER: dev.davidsaint.rootle
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Support/Info-iOS.plist
      properties:
        CFBundleDisplayName: Rootle
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        RootleAppGroup: group.dev.davidsaint.rootle
        RootleAnthropicKey: $(ROOTLE_ANTHROPIC_KEY)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: dev.davidsaint.rootle
            CFBundleURLSchemes: [rootle]
    entitlements:
      path: Support/Rootle-iOS.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.davidsaint.rootle]
    dependencies:
      - target: RootleWidget-iOS

  RootleWidget-iOS:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: RootleWidget
        PRODUCT_BUNDLE_IDENTIFIER: dev.davidsaint.rootle.widget
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Support/Widget-iOS.plist
      properties:
        CFBundleDisplayName: Rootle
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        RootleAppGroup: group.dev.davidsaint.rootle
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Support/Widget-iOS.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.davidsaint.rootle]

  Rootle-macOS:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_NAME: Rootle
        PRODUCT_BUNDLE_IDENTIFIER: dev.davidsaint.rootle
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: Support/Info-macOS.plist
      properties:
        CFBundleDisplayName: Rootle
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        RootleAppGroup: $(TeamIdentifierPrefix)dev.davidsaint.rootle
        RootleAnthropicKey: $(ROOTLE_ANTHROPIC_KEY)
        CFBundleURLTypes:
          - CFBundleURLName: dev.davidsaint.rootle
            CFBundleURLSchemes: [rootle]
    entitlements:
      path: Support/Rootle-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)dev.davidsaint.rootle]
    dependencies:
      - target: RootleWidget-macOS

  RootleWidget-macOS:
    type: app-extension
    platform: macOS
    sources:
      - Widget
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: RootleWidget
        PRODUCT_BUNDLE_IDENTIFIER: dev.davidsaint.rootle.widget
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Support/Widget-macOS.plist
      properties:
        CFBundleDisplayName: Rootle
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        RootleAppGroup: $(TeamIdentifierPrefix)dev.davidsaint.rootle
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Support/Widget-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)dev.davidsaint.rootle]

schemes:
  Rootle-iOS:
    build:
      targets:
        Rootle-iOS: all
    run:
      config: Debug
  Rootle-macOS:
    build:
      targets:
        Rootle-macOS: all
    run:
      config: Debug
